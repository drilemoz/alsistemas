name: AL Sistemas VPS - publicar Release automática
on:
  push:
    branches: [main]
    paths:
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: als-vps-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar versão e testes
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          import json,re
          from pathlib import Path
          v=Path('VERSION').read_text().strip()
          assert re.fullmatch(r'\d+\.\d+\.\d+',v), 'VERSION inválida'
          assert json.loads(Path('vps/package.json').read_text())['version']==v
          assert json.loads(Path('github-manager.json').read_text())['version']==v
          print('Versão:',v)
          PYCODE
          (cd vps && npm run check && npm test)
          python3 -m unittest discover -s vps/tests -p 'test_*.py' -q
          bash -n instalar.sh inicio-termux.sh bootstrap-vps.sh
      - name: Verificar se a Release já existe
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version já publicada, sem sobrescrever."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Gerar pacote e manifesto SHA-256
        if: steps.version.outputs.exists == 'false'
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,subprocess,zipfile
          from pathlib import Path
          version=Path('VERSION').read_text().strip()
          name=f'AL-Sistemas-v{version}-VPS.zip'
          out=Path(os.environ['RUNNER_TEMP'])
          files=[os.fsdecode(x) for x in subprocess.check_output(['git','ls-files','-z']).split(b'\0') if x]
          with zipfile.ZipFile(out/name,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for f in sorted(files):
                  if Path(f).is_symlink(): raise SystemExit('Link não permitido: '+f)
                  z.write(f,f)
          digest=hashlib.sha256((out/name).read_bytes()).hexdigest()
          manifest={'schema':1,'version':version,'asset':name,'sha256':digest}
          (out/'update-manifest.json').write_text(json.dumps(manifest,separators=(',',':'))+'\n')
          print(f'Pacote: {name}, {len(files)} arquivos, SHA-256 {digest}')
          PYCODE
      - name: Publicar Release sem assinatura
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          gh release create "v$version" \
            "$RUNNER_TEMP/AL-Sistemas-v${version}-VPS.zip" \
            "$RUNNER_TEMP/update-manifest.json" \
            --target "$GITHUB_SHA" --title "AL Sistemas VPS v$version" \
            --notes "Release gerada automaticamente pelo GitHub Actions. Arquivo verificado por SHA-256. A instalação exige autenticação administrativa no painel."
